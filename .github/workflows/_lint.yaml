name: Python package

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60


jobs:
  lint:
    timeout-minutes: ${{ inputs.timeout }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Install the project dependencies
        run: make install
      - name: Run linting
        run: make lint