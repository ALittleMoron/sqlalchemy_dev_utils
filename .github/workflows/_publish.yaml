name: Publishing

on:
  workflow_call:
    secrets:
      pdm-username:
        required: true
      pdm-password:
        required: true
    inputs:
      python-version:
        required: true
        type: string
        default: "3.11"
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60


jobs:
  publish:
    timeout-minutes: ${{ inputs.timeout }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Build package distributions
        run: uv build --no-sources
      - name: Publish package distributions to PyPI
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.pdm-username }}
          UV_PUBLISH_PASSWORD: ${{ secrets.pdm-password }}
        run: uv publish