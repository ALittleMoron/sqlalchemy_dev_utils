name: Testing

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      sqlalchemy-version:
        required: false
        type: string
        default: "2.1"
      coverage:
        required: false
        type: boolean
        default: false
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60


jobs:
  test:
    permissions:
      contents: write
    timeout-minutes: ${{ inputs.timeout }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Install the project dependencies
        run: make install
      - name: Select SQLAlchemy compatibility line
        run: uv pip install "sqlalchemy[asyncio]~=${{ inputs.sqlalchemy-version }}.0"
      - name: Run the automated tests with coverage
        if: ${{ inputs.coverage }}
        env:
          UV_NO_SYNC: "1"
        run: make tests
      - name: Coverage Badge
        if: ${{ inputs.python-version == '3.14' && inputs.sqlalchemy-version == '2.1' }}
        uses: tj-actions/coverage-badge-py@v2.0.4
      - name: Verify Changed files
        if: ${{ inputs.python-version == '3.14' && inputs.sqlalchemy-version == '2.1' }}
        uses: tj-actions/verify-changed-files@v20.0.4
        id: verify-changed-files
        with:
          files: coverage.svg
      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git commit -m "Updated coverage.svg"
      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.github_token }}
          branch: ${{ github.ref }}
